; PHP runtime settings for the Cloudflare container image.
; Keep these in sync with the limits documented in docs/CLOUDFLARE_DEPLOYMENT.md.

memory_limit = 512M
upload_max_filesize = 200M
post_max_size = 220M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

; Blade views, config and routes are prebuilt in the image.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
