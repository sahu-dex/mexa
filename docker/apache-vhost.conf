# Apache vhost for the Mexa Motion Laravel application.
# Document root is public/ so app code, .env and storage stay out of the web root.
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Never serve dotfiles (.env, .htaccess, .git ...).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Uploads: admin media (images max 8 MB, videos max 200 MB).
    LimitRequestBody 262144000

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
