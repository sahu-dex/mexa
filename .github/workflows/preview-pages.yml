name: Preview (temporary)

# Builds a static, shareable copy of the site and publishes it to GitHub Pages.
# Temporary hosting for client review — safe to delete this workflow + the Pages
# deployment at any time; it does not affect the PHP application.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/550dace5-mexa

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd
          coverage: none

      - name: Prepare a SQLite-backed copy of the site
        run: |
          set -euo pipefail
          rm -rf /tmp/www && mkdir -p /tmp/www
          tar --exclude='./.git' -cf - . | (cd /tmp/www && tar -xf -)
          mkdir -p /tmp/www/storage

          cat > /tmp/build_db.py <<'PY'
          import json, sqlite3, os

          data = json.load(open('/tmp/www/database/seed-data.json', encoding='utf-8'))
          dbp = '/tmp/www/storage/preview.sqlite'
          if os.path.exists(dbp):
              os.remove(dbp)
          con = sqlite3.connect(dbp)
          cur = con.cursor()

          def sqltype(v):
              if isinstance(v, bool):
                  return 'INTEGER'
              if isinstance(v, int):
                  return 'INTEGER'
              if isinstance(v, float):
                  return 'REAL'
              return 'TEXT'

          for table, rows in data.items():
              if table == 'settings' or not rows:
                  continue
              cols = {}
              for r in rows:
                  for k, v in r.items():
                      cols.setdefault(k, sqltype(v))
              cols['id'] = 'INTEGER PRIMARY KEY'
              defs = ', '.join('"%s" %s' % (k, t) for k, t in cols.items())
              cur.execute('CREATE TABLE "%s" (%s)' % (table, defs))

          cur.execute('CREATE TABLE "settings" ("setting_key" TEXT PRIMARY KEY, "setting_value" TEXT, "setting_group" TEXT)')
          cur.execute('''CREATE TABLE "messages" ("id" INTEGER PRIMARY KEY AUTOINCREMENT, "type" TEXT DEFAULT 'booking', "ticket_ref" TEXT, "name" TEXT, "email" TEXT, "phone" TEXT, "subject" TEXT, "message" TEXT, "service_id" INTEGER, "package_id" INTEGER, "package_quality" TEXT, "quoted_price" REAL, "currency" TEXT DEFAULT 'USD', "status" TEXT DEFAULT 'pending', "admin_notes" TEXT, "ip_hash" TEXT, "created_at" TEXT DEFAULT CURRENT_TIMESTAMP, "updated_at" TEXT DEFAULT CURRENT_TIMESTAMP)''')
          cur.execute('''CREATE TABLE "admins" ("id" INTEGER PRIMARY KEY AUTOINCREMENT, "username" TEXT UNIQUE, "email" TEXT, "password_hash" TEXT, "last_login_at" TEXT, "created_at" TEXT DEFAULT CURRENT_TIMESTAMP, "updated_at" TEXT DEFAULT CURRENT_TIMESTAMP)''')

          for table, rows in data.items():
              if not rows:
                  continue
              if table == 'settings':
                  for r in rows:
                      cur.execute('INSERT OR REPLACE INTO "settings" ("setting_key","setting_value","setting_group") VALUES (?,?,?)',
                                  (r.get('key'), r.get('value', ''), r.get('group', 'general')))
                  continue
              ordered, seen = [], set()
              for r in rows:
                  for k in r:
                      if k not in seen:
                          seen.add(k)
                          ordered.append(k)
              has_id = 'id' in ordered
              if not has_id:
                  ordered = ['id'] + ordered
              cols_sql = ','.join('"%s"' % c for c in ordered)
              ph = ','.join('?' * len(ordered))
              for i, r in enumerate(rows, start=1):
                  vals = []
                  for c in ordered:
                      if c == 'id' and not has_id:
                          vals.append(i)
                          continue
                      v = r.get(c)
                      vals.append(1 if v is True else 0 if v is False else v)
                  cur.execute('INSERT INTO "%s" (%s) VALUES (%s)' % (table, cols_sql, ph), vals)

          cols = [r[1] for r in cur.execute('PRAGMA table_info(reviews)')]
          if 'ip_hash' not in cols:
              cur.execute('ALTER TABLE "reviews" ADD COLUMN "ip_hash" TEXT')
          con.commit()
          print('tables:', {t: cur.execute('SELECT COUNT(*) FROM "%s"' % t).fetchone()[0] for t in data})
          con.close()
          PY
          python3 /tmp/build_db.py

          cat > /tmp/www/config/db.php <<'PHPSHIM'
          <?php
          declare(strict_types=1);

          // Preview shim: read-only SQLite mirror of database/seed-data.json.
          if (PHP_SAPI !== 'cli' && isset($_SERVER['SCRIPT_FILENAME']) && realpath($_SERVER['SCRIPT_FILENAME']) === __FILE__) {
              http_response_code(403);
              exit('Forbidden');
          }

          require_once __DIR__ . '/config.php';

          function db(): PDO
          {
              static $pdo = null;
              if ($pdo instanceof PDO) {
                  return $pdo;
              }
              $path = dirname(__DIR__) . '/storage/preview.sqlite';
              if (!is_file($path)) {
                  http_response_code(500);
                  exit('Preview database missing.');
              }
              $pdo = new PDO('sqlite:' . $path, null, null, [
                  PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
              ]);
              $pdo->exec('PRAGMA journal_mode = WAL');
              return $pdo;
          }
          PHPSHIM

      - name: Render static pages
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t /tmp/www >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/ ; then break; fi
            sleep 0.5
          done

          mkdir -p dist && cp -r /tmp/www/assets dist/assets && touch dist/.nojekyll

          cat > /tmp/export.py <<'PY'
          import urllib.request, re, os

          BASE = 'http://127.0.0.1:8080'
          PAGES = {
              '/': 'index.html',
              '/service.php': 'service.html',
              '/book.php': 'book.html',
              '/review.php': 'review.html',
              '/team.php': 'team.html',
              '/work.php': 'work.html',
          }
          MAP = {
              'index.php': 'index.html',
              'service.php': 'service.html',
              'book.php': 'book.html',
              'review.php': 'review.html',
              'team.php': 'team.html',
              'work.php': 'work.html',
          }

          for url, name in PAGES.items():
              html = urllib.request.urlopen(BASE + url, timeout=60).read().decode('utf-8', 'replace')
              for src, dst in MAP.items():
                  html = html.replace(src, dst)
              html = html.replace('<head>', '<head>\n    <meta name="robots" content="noindex, nofollow">', 1)
              open('dist/' + name, 'w', encoding='utf-8').write(html)
              print(name, len(html), 'bytes')
          PY
          python3 /tmp/export.py

          echo '--- php log tail ---'; tail -5 /tmp/php-server.log || true
          ls -la dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
